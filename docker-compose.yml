services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securedocs
      POSTGRES_PASSWORD: securedocs_dev
      POSTGRES_DB: securedocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedocs -d securedocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://securedocs:securedocs_dev@postgres:5432/securedocs
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
