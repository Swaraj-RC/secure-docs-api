services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=256MB -c work_mem=16MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securedocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securedocs_prod_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-securedocs}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securedocs} -d ${POSTGRES_DB:-securedocs}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - internal_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-securedocs}:${POSTGRES_PASSWORD:-securedocs_prod_change_me}@postgres:5432/${POSTGRES_DB:-securedocs}
      ENVIRONMENT: production
      DEBUG: "false"
      WORKERS: "4"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      RATE_LIMITING_ENABLED: "true"
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - internal_net

volumes:
  pgdata_prod:
  uploads_prod:

networks:
  internal_net:
    driver: bridge

